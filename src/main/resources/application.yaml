server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: timi-api
  profiles:
    active: ${PROFILE}
  web:
    resources:
      add-mappings: false

  datasource:
    url: jdbc:postgresql://${DB_HOST_NAME}/${DB_DATABASE_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        auto_quote_keyword: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

#cloudinary:
#  cloud-name: ${CLOUDINARY_CLOUD_NAME}

sepay:
  secret-key: ${SEPAY_SECRET_KEY}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
